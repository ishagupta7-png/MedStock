spring.application.name=transfer-service
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://localhost:5432/medstock
spring.datasource.username=postgres
spring.datasource.password=Ishagupta@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

escalation.timeout-seconds=300

resilience4j.circuitbreaker.instances.inventoryService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=300
resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true
# No ignore-exceptions entry for InsufficientStockException on purpose. Resilience4j only inspects
# exceptions that cross the boundary of an @CircuitBreaker-annotated method, and every insufficient-stock
# throw happens outside one: in TransferServiceImpl.approveTransfer and in InventoryClient.deductStock,
# neither of which is annotated. Listing it read as protection that was never in effect.
resilience4j.circuitbreaker.instances.branchService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.branchService.sliding-window-size=10
resilience4j.circuitbreaker.instances.branchService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.branchService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.branchService.wait-duration-in-open-state=300
resilience4j.circuitbreaker.instances.branchService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.branchService.automatic-transition-from-open-to-half-open-enabled=true

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
